[project]
name = "faresnipe-multiuser"
version = "0.1.0"
description = "Multi-user Telegram flight fare monitoring service with freemium delivery queue"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
keywords = ["flights", "fares", "telegram", "bot", "multi-user", "freemium"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Chat",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "psycopg[binary,pool]>=3.1",
    "alembic>=1.13",
    "fast-flights>=3.0.2",
    "python-dotenv>=1.2",
    "typing_extensions>=4.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.28",
    "ruff>=0.6",
]
scraping = ["playwright>=1.40"]

[project.scripts]
faresnipe-multiuser = "faresnipe_multiuser.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/faresnipe_multiuser"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E401", "E501", "E702", "F401", "F541", "F811", "I001"]

[tool.pytest.ini_options]
testpaths = ["tests"]